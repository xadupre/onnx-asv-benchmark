name: Publish benchmark pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-pages.yml
      - asv.conf.json
      - tools/customize_pages.py
      - tools/system_theme.css
      - tools/site_data.py

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out benchmark results
        uses: actions/checkout@v7
        with:
          repository: xadupre/cache_data
          path: cache-data
          sparse-checkout: onnx-asv-benchmark
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build ASV site
        run: |
          test -d cache-data/onnx-asv-benchmark/shards
          python tools/merge_results.py \
            cache-data/onnx-asv-benchmark/shards \
            .asv/results
          python tools/remove_track_benchmarks.py .asv/results/benchmarks.json
          python -m pip install asv==0.6.6
          asv publish --no-pull
          python -m tools.customize_pages .asv/html
          python tools/site_data.py configure \
            .asv/html \
            https://raw.githubusercontent.com/xadupre/cache_data/main/onnx-asv-benchmark/site-data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .asv/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
