name: GenAI compatibility

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genai:
    name: ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependencies: latest-releases
            source: release
          - dependencies: main-branches-abi3
            source: main
            python-abi: stable
            stable-abi: "ON"
          - dependencies: main-branches-native
            source: main
            python-abi: native
            stable-abi: "OFF"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out onnx-light main
        if: matrix.source == 'main'
        uses: actions/checkout@v4
        with:
          repository: xadupre/onnx-light
          ref: main
          path: upstream/onnx-light
      - name: Check out onnx-light-cpu main
        if: matrix.source == 'main'
        uses: actions/checkout@v4
        with:
          repository: xadupre/onnx-light-cpu
          ref: main
          path: upstream/onnx-light-cpu
      - name: Install benchmark dependencies
        run: |
          python -m pip install \
            numpy==2.5.3 \
            onnx==1.23.1 \
            onnxruntime==1.30.0 \
            onnxruntime-genai==0.15.2 \
            torch \
            transformers==5.15.0 \
            "scipy>=1.18.0" \
            "ml_dtypes>=0.6.0"
          python -m pip install --no-deps \
            "modelbuilder @ git+https://github.com/xadupre/mbext.git@aadae02d50480298db28716e4769a13b3d82f819"
      - name: Install latest releases
        if: matrix.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir wheels
          onnx_light_tag="$(gh release view --repo xadupre/onnx-light --json tagName --jq .tagName)"
          onnx_light_cpu_tag="$(gh release view --repo xadupre/onnx-light-cpu --json tagName --jq .tagName)"
          gh release download \
            --repo xadupre/onnx-light \
            --pattern "onnx_light-${onnx_light_tag}-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" \
            --dir wheels
          gh release download \
            --repo xadupre/onnx-light-cpu \
            --pattern "onnx_light_cpu-${onnx_light_cpu_tag}-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" \
            --dir wheels
          python -m pip install wheels/onnx_light-*.whl wheels/onnx_light_cpu-*.whl
      - name: Build and install main branches
        if: matrix.source == 'main'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python -m pip install scikit-build-core nanobind
          if [[ "${{ matrix.python-abi }}" == "stable" ]]; then
            python -m pip install --no-build-isolation \
              -C wheel.py-api=cp312 \
              upstream/onnx-light
            CMAKE_ARGS="-DONNX_LIGHT_CPU_RELEASE_WHEEL=ON" \
              python -m pip install --no-build-isolation --no-deps \
                -C wheel.py-api=cp312 \
                upstream/onnx-light-cpu
          else
            python -m pip install --no-build-isolation \
              -C cmake.define.ONNX_LIGHT_PYTHON_STABLE_ABI=OFF \
              upstream/onnx-light
            CMAKE_ARGS="-DONNX_LIGHT_CPU_RELEASE_WHEEL=ON -DONNX_LIGHT_CPU_PYTHON_STABLE_ABI=${{ matrix.stable-abi }}" \
              python -m pip install --no-build-isolation --no-deps \
                upstream/onnx-light-cpu
          fi
      - name: Run GenAI scenarios
        run: python -m tools.check_genai
