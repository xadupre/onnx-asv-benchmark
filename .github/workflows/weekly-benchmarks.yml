name: Twice-weekly benchmark shards

on:
  schedule:
    - cron: "17 1 * * 1"
    - cron: "47 1 * * 1"
    - cron: "17 5 * * 2"
    - cron: "47 5 * * 2"
    - cron: "17 9 * * 3"
    - cron: "47 9 * * 3"
    - cron: "47 11 * * 4"
    - cron: "17 13 * * 4"
    - cron: "47 13 * * 4"
    - cron: "17 17 * * 5"
    - cron: "47 17 * * 5"
    - cron: "17 21 * * 6"
    - cron: "47 21 * * 6"
    - cron: "17 23 * * 0"
  workflow_dispatch:
    inputs:
      shard:
        description: Shards to run, comma-separated (for example ops/math/add,models/llm/tiny_llm)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Select shards
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHARD: ${{ inputs.shard }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            matrix="$(python -c 'import json, sys; shards = [s.strip() for s in sys.argv[1].split(",") if s.strip()]; assert shards, "No shards requested"; print(json.dumps({"shard": shards}))' "$REQUESTED_SHARD")"
          else
            case "$SCHEDULE" in
              "17 1 * * 1") bucket=0 ;;
              "47 13 * * 4") bucket=0 ;;
              "17 5 * * 2") bucket=1 ;;
              "47 17 * * 5") bucket=1 ;;
              "17 9 * * 3") bucket=2 ;;
              "47 21 * * 6") bucket=2 ;;
              "17 13 * * 4") bucket=3 ;;
              "47 1 * * 1") bucket=3 ;;
              "17 17 * * 5") bucket=4 ;;
              "47 5 * * 2") bucket=4 ;;
              "17 21 * * 6") bucket=5 ;;
              "47 9 * * 3") bucket=5 ;;
              "17 23 * * 0") bucket=6 ;;
              "47 11 * * 4") bucket=6 ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
            matrix="$(python tools/scheduled_shards.py "$bucket")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  migrate-cache:
    needs: prepare
    concurrency:
      group: benchmark-cache-migration
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Migrate legacy results
        env:
          GH_TOKEN: ${{ secrets.CACHE_DATA_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git clone --depth 1 https://github.com/xadupre/cache_data.git cache-data
          mkdir -p cache-data/onnx-asv-benchmark
          python tools/migrate_results.py cache-data/onnx-asv-benchmark
          git -C cache-data add --all -- onnx-asv-benchmark
          if ! git -C cache-data diff --cached --quiet; then
            git -C cache-data commit -m "Migrate onnx-asv-benchmark result shards"
            git -C cache-data push origin main
          fi

  benchmark:
    needs:
      - prepare
      - migrate-cache
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: benchmark-shard-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install asv==0.6.6
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          regex="$(python -c 'import re, sys; print("^" + re.escape(sys.argv[1].replace("/", ".")) + r"\.")' "$SHARD")"
          machine="$(python tools/setup_machine.py)"
          status=0
          python -m asv run --machine "$machine" --bench "$regex" HEAD^! || status=$?
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi
          python -m tools.check_results .asv/results "$SHARD"
      - name: Publish shard
        env:
          GH_TOKEN: ${{ secrets.CACHE_DATA_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: |
          gh auth setup-git
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          python tools/publish_results.py --shard "$SHARD"

  publish-data:
    needs: benchmark
    if: ${{ always() }}
    uses: ./.github/workflows/publish-data.yml
    secrets: inherit

  report-failures:
    needs: benchmark
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create benchmark failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Benchmark failures in run $GITHUB_RUN_ID"
          existing_issue="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "$title in:title" \
              --limit 100 \
              --json number,state,title |
              jq --arg title "$title" -r \
                '.[] | select(.title == $title) | [.number, .state] | @tsv' |
              head -n 1
          )"
          issue_number="${existing_issue%%$'\t'*}"
          issue_state="${existing_issue#*$'\t'}"
          failures="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" |
              jq '[
                .jobs[]
                | select(.name | startswith("benchmark ("))
                | select(.conclusion == "failure" or .conclusion == "cancelled")
              ]'
          )"
          count="$(jq length <<<"$failures")"

          if [[ "$count" == 0 ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "All benchmark shards succeeded on run attempt $GITHUB_RUN_ATTEMPT."
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/benchmark-failures.md"
          {
            echo "$count benchmark shard(s) failed or were cancelled."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo
            echo "| Shard job | Conclusion | Failed step |"
            echo "|---|---|---|"
            jq -r '
              .[]
              | [
                  .name,
                  .html_url,
                  .conclusion,
                  ([.steps[]? | select(.conclusion == "failure") | .name] | join(", "))
                ]
              | @tsv
            ' <<<"$failures" |
              while IFS=$'\t' read -r name url conclusion failed_step; do
                printf '| [%s](%s) | `%s` | %s |\n' \
                  "$name" "$url" "$conclusion" "${failed_step:--}"
              done
          } >"$body"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$body"
            if [[ "$issue_state" == "CLOSED" ]]; then
              gh issue reopen "$issue_number" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$body"
          fi
